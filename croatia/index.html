<style>
:root{
  --sea-deep:#0a3d4d;
  --sea:#137884;
  --sea-soft:#d9ecec;
  --stone:#f2efe8;
  --card:#ffffff;
  --ink:#12262e;
  --muted:#61757d;
  --line:#ded8cd;
  --sun:#c8811d;
  --sun-soft:#fbf0dc;
  --pine:#2f6b4f;
  --pine-soft:#e4efe8;
  --rose:#a8452f;
  --rose-soft:#f7e6e2;
  --sea-ink:#0a3d4d;
  --sun-line:#eddcbb;
  --field:#fcfbf8;
  --card-2:#fbfaf7;
  --ghost:#f1efe9;
  --work:#9fb0b6;
  --work-soft:#eceff0;
  --work-ink:#5c7078;
  --handle:#cfc9bd;
  --veil:rgba(255,255,255,.94);
  --head:#0a3d4d;
  --head-ink:#eef6f6;
  --head-dim:#8fb5bc;
  --shadow:0 1px 2px rgba(18,38,46,.04);
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone);
  color:var(--ink);
  font:16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--sea)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--head);color:var(--head-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;
}
.htop{display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:1px 0 0;font-size:12px;color:var(--head-dim)}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.hbtn{width:38px;height:38px;flex:none;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--head-ink);font-size:18px}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:9px 13px 11px;color:var(--head-dim);font-size:14px;font-weight:600;white-space:nowrap;
  border-bottom:3px solid transparent;
}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--sun)}

/* ---------- layout ---------- */
main{max-width:720px;margin:0 auto;padding:14px 12px calc(90px + var(--safe-b))}
.panel[hidden]{display:none}
h2.sec{font-size:13px;font-weight:700;color:var(--muted);margin:22px 4px 8px}
h2.sec:first-child{margin-top:4px}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--sea-deep);border-color:var(--sea-deep);color:#fff}

/* ---------- day card ---------- */
.day{
  background:var(--card);border-radius:var(--r);margin-bottom:8px;
  border:1px solid var(--line);overflow:hidden;position:relative;
}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sea)}
.day[data-kind="weekend"]::before{background:var(--sun)}
.day[data-kind="work"]::before{background:var(--work)}
.day[data-kind="free"]::before{background:var(--pine)}
.day[data-kind="travel"]::before{background:var(--rose)}
.day.done{background:var(--card-2)}
.day.done .dwhere{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.day.today{border-color:var(--sea);box-shadow:0 0 0 2px rgba(19,120,132,.18)}

.dhead{display:flex;align-items:flex-start;gap:11px;padding:12px 12px 12px 15px;width:100%;text-align:left}
.tick{
  flex:none;width:27px;height:27px;margin-top:1px;border-radius:8px;border:2px solid var(--line);
  background:var(--card);display:grid;place-items:center;color:transparent;font-size:15px;font-weight:800;
}
.tick[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.dmain{flex:1;min-width:0}
.ddate{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.badge{padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700}
.b-weekend{background:var(--sun-soft);color:var(--sun)}
.b-work{background:var(--work-soft);color:var(--work-ink)}
.b-free{background:var(--pine-soft);color:var(--pine)}
.b-travel{background:var(--rose-soft);color:var(--rose)}
.b-today{background:var(--sea);color:#fff}
.dwhere{font-size:16px;font-weight:650;line-height:1.3;margin:2px 0 3px}
.dmeta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.dmeta b{color:var(--ink);font-weight:650}
.chev{flex:none;align-self:center;color:var(--muted);font-size:13px;transition:transform .18s}
.day.open .chev{transform:rotate(90deg)}

.dbody{padding:0 14px 14px 15px;border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
.dbody p{margin:0 0 12px;font-size:14.5px;line-height:1.55}
.dlist{margin:0 0 13px;padding:0;list-style:none}
.dlist li{position:relative;padding-left:16px;margin-bottom:7px;font-size:14.5px;line-height:1.5}
.dlist li:last-child{margin-bottom:0}
.dlist li::before{
  content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;
  border-radius:50%;background:var(--sea);opacity:.55;
}
.dlist .t{color:var(--sea);font-weight:700;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.act{
  padding:9px 13px;border-radius:10px;background:var(--sea-soft);color:var(--sea-ink);
  font-size:13.5px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.act.ghost{background:var(--ghost);color:var(--muted)}
.act.danger{background:var(--rose-soft);color:var(--rose)}
label.fl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
textarea,input[type=text],input[type=number]{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  background:var(--field);font-size:14.5px;resize:vertical;
}
textarea{min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- generic list rows ---------- */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .rt{flex:1;min-width:0}
.row .rt strong{display:block;font-size:14.5px;font-weight:650}
.row .rt span{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
.row .rv{flex:none;max-width:47%;text-align:right;font-size:13.5px;font-weight:700;color:var(--sea-ink)}
.row.checked .rt strong{text-decoration:line-through;color:var(--muted)}

/* ---------- callouts ---------- */
.note{background:var(--sun-soft);border:1px solid var(--sun-line);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.55;margin-bottom:10px}
.note b{font-weight:700}
.tipbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.tipbox h3{margin:0 0 6px;font-size:14.5px;font-weight:700}
.tipbox ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.tipbox li{margin-bottom:5px}
.tipbox li:last-child{margin-bottom:0}

/* ---------- totals bar ---------- */
.totals{
  position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:var(--veil);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:9px 16px calc(9px + var(--safe-b));
  display:flex;gap:14px;align-items:center;justify-content:center;
  font-size:12.5px;color:var(--muted);
}
.totals b{color:var(--ink);font-size:15px;font-weight:700;display:block;line-height:1.15}
.totals div{text-align:center}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(10,40,50,.45)}
.sheet .inner{
  position:absolute;left:0;right:0;bottom:0;background:var(--stone);
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--safe-b));
  max-height:88vh;overflow:auto;
}
.sheet .hnd{width:38px;height:4px;border-radius:99px;background:var(--handle);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:17px}
.big{display:block;width:100%;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-size:15px;font-weight:650;text-align:left;margin-bottom:8px}
.big small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.big.danger{color:var(--rose)}
.toast{
  position:fixed;bottom:calc(72px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--sea-deep);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;z-index:50;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 20px}

/* ---------- search ---------- */
.search{position:relative;margin:0 2px 8px}
.search input{
  width:100%;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px 11px 36px;background:var(--card);font-size:15px;
  -webkit-appearance:none;appearance:none;
}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:15px;
  display:none;place-items:center;
}
.search.has .clr{display:grid}
.count{font-size:12px;color:var(--muted);margin:0 6px 8px;font-weight:600}

/* ---------- inline add row ---------- */
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;
  padding:12px;background:var(--card);font-size:15px;
}
.addrow button{
  flex:none;width:48px;border-radius:12px;background:var(--sea-deep);color:#fff;
  font-size:20px;font-weight:700;display:grid;place-items:center;
}

/* ---------- polish ---------- */
.day{scroll-margin-top:118px;box-shadow:var(--shadow)}
.rows{box-shadow:var(--shadow)}
.dhead{cursor:pointer}
.dhead .chev{padding:0 4px}
.tick{transition:background .15s,border-color .15s,transform .12s}
.tick:active{transform:scale(.9)}
.chip{transition:background .15s,color .15s,border-color .15s}
.dbody{animation:reveal .18s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ring{cursor:pointer;background:none;padding:0;border-radius:50%}
.ring svg{display:block}
.row .rb{flex:1;min-width:0;text-align:left;padding:0}
.rows .row:has(.rb):active{background:var(--card-2)}
main{padding-bottom:calc(94px + var(--safe-b))}
.empty b{color:var(--ink)}
@media (min-width:640px){
  .grid2{gap:10px}
  .day{margin-bottom:10px}
}


/* ---------- dark mode ----------
   Two blocks on purpose: the OS preference (unless the user forced light),
   and the user's explicit choice. Keep them in sync. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea-deep:#0d2f3a;
    --sea-ink:#a9dee7;
    --sea:#5cbcc8;
    --sea-soft:#17353d;
    --stone:#0e181d;
    --card:#16242b;
    --ink:#e7eff1;
    --muted:#93a7af;
    --line:#26383f;
    --sun:#e0a34f;
    --sun-soft:#33270f;
    --sun-line:#4a3a17;
    --pine:#5aa87d;
    --pine-soft:#183024;
    --rose:#e08d78;
    --rose-soft:#3a201a;
    --field:#111d23;
    --card-2:#131f25;
    --ghost:#1d2b32;
    --work:#7b8f98;
    --work-soft:#1e2b31;
    --work-ink:#a4b6bd;
    --handle:#3a4c54;
    --veil:rgba(14,24,29,.94);
    --head:#0a2028;
    --head-ink:#e7f1f3;
    --head-dim:#89a8b1;

/* ===================== STATE ===================== */
const KEY = "split2026:v4";
let mem = null;
const store = {
  read(){
    try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
    catch(e){ return mem; }
  },
  write(v){
    mem = v;
    try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){}
  }
};

function freshState(){
  return {
    days: JSON.parse(JSON.stringify(SEED_DAYS)).map(d=>({...d, done:false, note:"", actual:""})),
    beaches: {},
    pack: SEED_PACK.map((t,i)=>({id:"p"+i, text:t, done:false})),
    filter:"all", tab:"plan", q:"", theme:"auto"
  };
}
let S = store.read() || freshState();
// forward-compat: make sure new seed days appear for existing saves
(function reconcile(){
  const have = new Set(S.days.map(d=>d.id));
  SEED_DAYS.forEach(sd=>{ if(!have.has(sd.id)) S.days.push({...sd,done:false,note:"",actual:""}); });
  S.days.forEach(d=>{ if(d.done===undefined) d.done=false; if(d.note===undefined) d.note=""; if(d.actual===undefined) d.actual=""; });
  if(!S.beaches) S.beaches={};
  if(!S.pack) S.pack = SEED_PACK.map((t,i)=>({id:"p"+i,text:t,done:false}));
  if(typeof S.q!=="string") S.q="";
  if(!S.theme) S.theme="auto";
  if(!S.tab) S.tab="plan";
  if(!S.filter) S.filter="all";
  S.days.sort((a,b)=>a.date.localeCompare(b.date));
})();
const save = ()=>store.write(S);

/* ===================== HELPERS ===================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mapsUrl = q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const eur = n=>Math.round(n).toLocaleString("sk-SK")+" €";
const KIND_LABEL = {weekend:"víkend", work:"po práci", free:"voľný deň", travel:"presun", trip:"výlet"};
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ const [y,m,d]=iso.split("-"); return parseInt(d,10)+". "+parseInt(m,10)+"."; }
function plural(n,one,few,many){ return n===1?one:(n>=2&&n<=4?few:many); }
// desc is a list of bullets; old saves / custom days may still hold a plain string
const descLines = d => Array.isArray(d.desc) ? d.desc : String(d.desc||"").split("\n").filter(x=>x.trim());
const descText  = d => descLines(d).join("\n");
function bullet(line){
  const m=String(line).match(/^(\d{1,2}:\d{2}(?:\s*[–-]\s*\d{1,2}:\d{2})?)\s+(.*)$/);
  return m ? `<b class="t">${esc(m[1])}</b> ${esc(m[2])}` : esc(line);
}
function dayDiff(a,b){ return Math.round((Date.parse(b+"T00:00:00")-Date.parse(a+"T00:00:00"))/864e5); }
let saveT;
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(save,250); }

const THEME_LABEL={auto:"Podľa systému", light:"Svetlý", dark:"Tmavý"};
function applyTheme(){
  const t=S.theme||"auto", root=document.documentElement;
  if(t==="auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme",t);
  const dark = t==="dark" || (t==="auto" && matchMedia("(prefers-color-scheme:dark)").matches);
  $("#tc").setAttribute("content", dark?"#0a2028":"#0a3d4d");
}
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if((S.theme||"auto")==="auto") applyTheme(); });

let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1900);
}

/* ===================== RENDER: DAYS ===================== */
const openDays = new Set();

function dayMatches(d){
  const q=(S.q||"").trim().toLowerCase();
  if(q){
    const hay=(d.where+" "+d.time+" "+(d.costLabel||"")+" "+(d.note||"")+" "+
               (KIND_LABEL[d.kind]||"")+" "+d.date+" "+descText(d)).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  const f=S.filter;
  if(f==="all") return true;
  if(f==="todo") return !d.done;
  if(f==="weekend") return d.kind==="weekend";
  if(f==="free") return d.kind==="free"||d.kind==="trip"||d.kind==="travel";
  if(f==="work") return d.kind==="work";
  return true;
}

function renderDays(){
  const host=$("#days"); const t=todayISO();
  const list=S.days.filter(dayMatches);
  const q=(S.q||"").trim(), cnt=$("#count");
  if(q||S.filter!=="all"){
    cnt.hidden=false;
    cnt.textContent=list.length+" "+plural(list.length,"deň","dni","dní")+" z "+S.days.length;
  } else cnt.hidden=true;
  if(!list.length){
    host.innerHTML='<div class="empty">Nič nesedí na toto hľadanie.<br><b>Skúste iné slovo alebo filter „Všetko“.</b></div>';
    return;
  }
  host.innerHTML = list.map(d=>{
    const open=openDays.has(d.id), isToday=d.date===t, editing=openDays.has("edit:"+d.id);
    return `<article class="day${d.done?" done":""}${open?" open":""}${isToday?" today":""}" data-kind="${d.kind}" data-id="${d.id}">
      <div class="dhead">
        <button class="tick" data-act="tick" aria-pressed="${d.done}" aria-label="Označiť ako hotové">✓</button>
        <button class="dmain" data-act="open" style="text-align:left">
          <div class="ddate">
            <span>${esc(d.dow)} ${fmtDate(d.date)}</span>
            <span class="badge b-${d.kind==="trip"?"free":d.kind}">${KIND_LABEL[d.kind]||d.kind}</span>
            ${isToday?'<span class="badge b-today">dnes</span>':""}
          </div>
          <div class="dwhere">${esc(d.where)}</div>
          <div class="dmeta"><span>${esc(d.time)}</span><span><b>${esc(d.costLabel||"—")}</b></span></div>
        </button>
        <span class="chev">▶</span>
      </div>
      ${open?dayBody(d,editing):""}
    </article>`;
  }).join("");
}

function dayBody(d,editing){
  if(editing){
    return `<div class="dbody">
      <label class="fl">Kam</label><input type="text" data-fld="where" value="${esc(d.where)}">
      <div class="grid2">
        <div><label class="fl">Čas / vzdialenosť</label><input type="text" data-fld="time" value="${esc(d.time)}"></div>
        <div><label class="fl">Cena (text)</label><input type="text" data-fld="costLabel" value="${esc(d.costLabel)}"></div>
      </div>
      <div class="grid2">
        <div><label class="fl">Odhad v € (číslo)</label><input type="number" data-fld="cost" value="${d.cost||0}"></div>
        <div><label class="fl">Typ dňa</label>
          <select data-fld="kind" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field)">
            ${["trip","weekend","work","free","travel"].map(k=>`<option value="${k}"${d.kind===k?" selected":""}>${KIND_LABEL[k]}</option>`).join("")}
          </select></div>
      </div>
      <label class="fl">Popis — každý riadok je jedna odrážka</label><textarea data-fld="desc" style="min-height:150px">${esc(descText(d))}</textarea>
      <label class="fl">Hľadať v mapách</label><input type="text" data-fld="map" value="${esc(d.map||"")}">
      <div class="acts" style="margin-top:14px">
        <button class="act" data-act="saveEdit">Uložiť zmeny</button>
        <button class="act ghost" data-act="cancelEdit">Zrušiť</button>
        <button class="act danger" data-act="del">Vymazať deň</button>
      </div>
    </div>`;
  }
  return `<div class="dbody">
    <ul class="dlist">${descLines(d).map(l=>`<li>${bullet(l)}</li>`).join("")}</ul>
    <div class="acts">
      ${d.map?`<a class="act" href="${esc(mapsUrl(d.map))}" target="_blank" rel="noopener">📍 Otvoriť v mapách</a>`:""}
      <button class="act ghost" data-act="swap">⇅ Prehodiť deň</button>
      <button class="act ghost" data-act="edit">Upraviť</button>
    </div>
    <label class="fl">Vaše poznámky k tomuto dňu</label>
    <textarea data-fld="note" placeholder="Rezervácie, časy odchodov, kde ste parkovali, čo bolo dobré…">${esc(d.note)}</textarea>
    <label class="fl">Skutočne minuté (€)</label>
    <input type="number" inputmode="decimal" data-fld="actual" value="${esc(d.actual)}" placeholder="${d.cost||0}">
  </div>`;
}

/* ===================== SWAP TWO DAYS =====================
   The date, weekday and day type belong to the calendar slot and stay put.
   The plan itself — place, times, cost, bullets, notes — is what moves. */
const PLAN_FIELDS = ["where","time","cost","costLabel","desc","map","done","note","actual"];
function swapDays(idA,idB){
  const a=S.days.find(x=>x.id===idA), b=S.days.find(x=>x.id===idB);
  if(!a||!b) return null;
  PLAN_FIELDS.forEach(f=>{ const t=a[f]; a[f]=b[f]; b[f]=t; });
  save();
  return {a,b};
}

/* ===================== RENDER: OTHER TABS ===================== */
function renderBeaches(){
  const groups=[...new Set(SEED_BEACHES.map(b=>b.group))];
  const seen=SEED_BEACHES.filter(b=>S.beaches[b.id]).length;
  $("#p-beaches").innerHTML = `<div class="note"><b>${seen}/${SEED_BEACHES.length} pláží odškrtnutých.</b> Ťuknite na riadok, keď ste tam boli — ikona 📍 otvorí mapu.</div>` +
    groups.map(g=>`
    <h2 class="sec">${esc(g)}</h2>
    <div class="rows">${SEED_BEACHES.filter(b=>b.group===g).map(b=>{
      const on=!!S.beaches[b.id];
      return `<div class="row${on?" checked":""}">
        <button class="tick" data-beach="${b.id}" aria-pressed="${on}" aria-label="Boli sme tu">✓</button>
        <button class="rb" data-beach="${b.id}"><div class="rt"><strong>${esc(b.name)}</strong><span>${esc(b.note)}</span></div></button>
        <a class="rv" href="${esc(mapsUrl(b.map))}" target="_blank" rel="noopener" aria-label="Otvoriť ${esc(b.name)} v mapách">📍</a>
      </div>`;}).join("")}</div>`).join("") +
    `<div class="note" style="margin-top:16px"><b>Nezabudnite:</b> pláže sú oblázkové a skalnaté — topánky do vody a šnorchel menia zážitok. Na skryté zátoky si doneste vlastnú vodu a jedlo.</div>`;
}

function renderMoney(){

  $("#p-money").innerHTML=`
    <div class="note"><b>Podľa plánu: ${eur(est)}</b> za vstupy a dopravu pre 2 osoby.
    ${act?`<br>Zatiaľ zapísané výdavky: <b>${eur(act)}</b>.`:"<br>Skutočné výdavky si zapisujte priamo v detaile každého dňa."}</div>

    <h2 class="sec">Trajekty a katamarány — jeden smer</h2>
    <div class="rows">${FERRIES.map(f=>`<div class="row"><div class="rt"><strong>${esc(f.r)}</strong><span>${esc(f.t)}</span></div><div class="rv">${esc(f.p)}</div></div>`).join("")}</div>
    <div class="note" style="margin-top:10px">Ceny v tabuľke sú <b>za jeden smer</b>. Na Vis, Hvar (mesto) a Korčulu berte <b>katamarán bez auta</b>. Auto sa oplatí len na Brač a na Stari Grad — do fronty príďte 45–60 min vopred.</div>

    <h2 class="sec">Vstupné — hlavné atrakcie 2026</h2>
    <div class="rows">${TICKETS.map(t=>`<div class="row"><div class="rt"><strong>${esc(t.n)}</strong><span>${esc(t.note)}</span></div><div class="rv">${esc(t.p)}</div></div>`).join("")}</div>

    <h2 class="sec">Orientačný rozpočet na celý mesiac (2 osoby)</h2>
    <div class="rows">${BUDGET.map(b=>`<div class="row"><div class="rt"><strong>${esc(b.n)}</strong></div><div class="rv">${esc(b.p)}</div></div>`).join("")}</div>
    <div class="note" style="margin-top:10px">Bez ubytovania v Splite a bežného jedla. Trajekty sú počítané tam aj späť pre 2 osoby. Na pláže, Marjan, Rivu aj prechod hlavnou chodbou paláca je vstup zdarma — dá sa výrazne ušetriť.</div>`;
}

function renderTips(){
  $("#p-tips").innerHTML = `<div class="note"><b>Núdzové číslo 112.</b> Do Chorvátska aj Bosny stačí občiansky preukaz — pas netreba.</div>` +
    TIPS.map(t=>`<div class="tipbox"><h3>${esc(t.h)}</h3><ul>${t.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
}

function renderPack(){
  const done=S.pack.filter(p=>p.done).length;
  $("#p-pack").innerHTML=`
    <div class="note"><b>${done}/${S.pack.length} zbalené.</b> Zoznam si pokojne upravte — tap na text ho prepíše.</div>
    <div class="rows">${S.pack.map(p=>`<div class="row${p.done?" checked":""}">
      <button class="tick" data-pack="${p.id}" aria-pressed="${p.done}" aria-label="Zbalené">✓</button>
      <div class="rt"><strong contenteditable="true" data-packtext="${p.id}">${esc(p.text)}</strong></div>
      <button class="rv" data-packdel="${p.id}" style="color:var(--rose)">✕</button>
    </div>`).join("")}</div>
    <form class="addrow" id="packForm">
      <input id="packInput" type="text" placeholder="Pridať položku…" aria-label="Pridať položku" autocomplete="off" enterkeyhint="done">
      <button type="submit" aria-label="Pridať">+</button>
    </form>`;
}

/* ===================== TOTALS & PROGRESS ===================== */
function renderTotals(){
  const total=S.days.length, done=S.days.filter(d=>d.done).length;
  const spent=S.days.filter(d=>d.done).reduce((a,d)=>a+(parseFloat(d.actual)|| +d.cost||0),0);
  const left=S.days.filter(d=>!d.done).reduce((a,d)=>a+(+d.cost||0),0);
  $("#tDone").textContent=done+"/"+total;
  $("#tSpent").textContent=eur(spent);
  $("#tLeft").textContent=eur(left);
  const pct=total?done/total:0;
  $("#ringArc").setAttribute("stroke-dashoffset", (119.4*(1-pct)).toFixed(1));
  $("#ringTxt").textContent=Math.round(pct*100)+"%";
}

const RENDER={plan:renderDays,beaches:renderBeaches,money:renderMoney,tips:renderTips,pack:renderPack};
function renderActive(){ (RENDER[S.tab]||renderDays)(); renderTotals(); renderSub(); }
function renderAll(){ renderActive(); }

function renderSub(){
  if(!S.days.length){ $("#sub").textContent=""; return; }
  const first=S.days[0].date, last=S.days[S.days.length-1].date, t=todayISO();
  const range=fmtDate(first)+" – "+fmtDate(last)+" "+last.slice(0,4);
  const toStart=dayDiff(t,first), toEnd=dayDiff(t,last);
  let extra="";
  if(toStart>0) extra=" · o "+toStart+" "+plural(toStart,"deň","dni","dní");
  else if(toEnd>=0) extra=" · deň "+(dayDiff(first,t)+1)+" z "+(dayDiff(first,last)+1);
  else extra=" · po ceste";
  $("#sub").textContent=range+extra;
}

function showTab(name){
  if(!RENDER[name]) name="plan";
  S.tab=name; save();
  document.querySelectorAll("nav [role=tab]").forEach(x=>x.setAttribute("aria-selected", x.dataset.tab===name));
  Object.keys(RENDER).forEach(t=>$("#p-"+t).hidden=(t!==name));
  renderActive();
}

/* ===================== EVENTS ===================== */
const TABS=[...document.querySelectorAll("nav [role=tab]")];
TABS.forEach((b,i)=>{
  b.addEventListener("click",()=>{ showTab(b.dataset.tab); window.scrollTo({top:0}); });
  b.addEventListener("keydown",e=>{
    const dir = e.key==="ArrowRight"?1 : e.key==="ArrowLeft"?-1 : 0;
    if(!dir) return;
    e.preventDefault();
    const next=TABS[(i+dir+TABS.length)%TABS.length];
    next.focus(); next.click();
  });
});

$("#filters").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  S.filter=c.dataset.f; save();
  document.querySelectorAll("#filters .chip").forEach(x=>x.setAttribute("aria-pressed", x===c));
  renderDays();
  c.scrollIntoView({block:"nearest",inline:"nearest"});
});

/* ---------- search ---------- */
const qBox=$("#q");
function syncSearch(){ $("#search").classList.toggle("has", !!qBox.value); }
qBox.addEventListener("input",()=>{ S.q=qBox.value; saveSoon(); syncSearch(); renderDays(); });
$("#qClear").addEventListener("click",()=>{
  qBox.value=""; S.q=""; save(); syncSearch(); renderDays(); qBox.focus();
});
qBox.addEventListener("keydown",e=>{ if(e.key==="Escape"){ qBox.value=""; S.q=""; save(); syncSearch(); renderDays(); } });

$("#days").addEventListener("click",e=>{
  const card=e.target.closest(".day"); if(!card) return;
  const id=card.dataset.id, d=S.days.find(x=>x.id===id);
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="tick"){
    d.done=!d.done; save(); renderDays(); renderTotals();
    toast(d.done?"Odškrtnuté":"Vrátené späť");
    return;
  }
  const toggle=()=>{ openDays.has(id)?openDays.delete(id):openDays.add(id); renderDays(); };
  if(act==="open"){ toggle(); return; }
  if(!act && e.target.closest(".dhead")){ toggle(); return; }
  if(act==="edit"){ openDays.add("edit:"+id); renderDays(); return; }
  if(act==="swap"){ openSwap(id); return; }
  if(act==="cancelEdit"){ openDays.delete("edit:"+id); renderDays(); return; }
  if(act==="saveEdit"){
    card.querySelectorAll("[data-fld]").forEach(el=>{
      const f=el.dataset.fld;
      if(f==="cost") d[f]=parseFloat(el.value)||0;
      else if(f==="desc") d[f]=el.value.split("\n").map(x=>x.trim()).filter(Boolean);
      else d[f]=el.value;
    });
    openDays.delete("edit:"+id); save(); renderDays(); renderTotals(); toast("Uložené"); return;
  }
  if(act==="del"){
    if(confirm("Vymazať deň „"+d.where+"“?")){
      S.days=S.days.filter(x=>x.id!==id); openDays.delete(id); openDays.delete("edit:"+id);
      save(); renderDays(); renderTotals(); toast("Deň vymazaný");
    }
  }
});

// notes + actual spend save as you type
$("#days").addEventListener("input",e=>{
  const el=e.target.closest("[data-fld]"); if(!el) return;
  const f=el.dataset.fld; if(f!=="note"&&f!=="actual") return;
  const id=e.target.closest(".day").dataset.id, d=S.days.find(x=>x.id===id);
  d[f]=el.value; saveSoon(); if(f==="actual") renderTotals();
});

$("#addDay").addEventListener("click",()=>{
  const id="c"+Date.now();
  S.days.push({id,date:todayISO(),dow:"",kind:"free",where:"Nový deň",time:"",cost:0,costLabel:"—",desc:[],map:"",done:false,note:"",actual:""});
  S.days.sort((a,b)=>a.date.localeCompare(b.date));
  openDays.add(id); openDays.add("edit:"+id);
  save(); renderDays(); renderTotals();
  document.querySelector(`[data-id="${id}"]`)?.scrollIntoView({block:"center"});
});

$("#p-beaches").addEventListener("click",e=>{
  const b=e.target.closest("[data-beach]"); if(!b) return;
  const id=b.dataset.beach; S.beaches[id]=!S.beaches[id]; save(); renderBeaches();
});

$("#p-pack").addEventListener("click",e=>{
  const t=e.target.closest("[data-pack]");
  if(t){ const p=S.pack.find(x=>x.id===t.dataset.pack); p.done=!p.done; save(); renderPack(); return; }
  const del=e.target.closest("[data-packdel]");
  if(del){ S.pack=S.pack.filter(x=>x.id!==del.dataset.packdel); save(); renderPack(); return; }
});
$("#p-pack").addEventListener("submit",e=>{
  e.preventDefault();
  const inp=$("#packInput"), txt=inp.value.trim();
  if(!txt) return;
  S.pack.push({id:"p"+Date.now(),text:txt,done:false}); save(); renderPack();
  const again=$("#packInput"); if(again) again.focus();
});
$("#p-pack").addEventListener("blur",e=>{
  const el=e.target.closest("[data-packtext]"); if(!el) return;
  const p=S.pack.find(x=>x.id===el.dataset.packtext);
  p.text=el.textContent.trim()||p.text; save();
},true);

/* ---------- menu sheet ---------- */
const sheet=$("#sheet");
let lastFocus=null, swapFrom=null;
function closeSheet(){
  sheet.classList.remove("on");
  swapFrom=null;
  if(lastFocus){ lastFocus.focus(); lastFocus=null; }
}
function openSheet(title,html){
  lastFocus=document.activeElement;
  $("#sheetTitle").textContent=title;
  $("#sheetBody").innerHTML=html;
  sheet.classList.add("on");
  sheet.querySelector("button")?.focus();
}

function openSwap(id){
  const d=S.days.find(x=>x.id===id); if(!d) return;
  swapFrom=id;
  const rows=S.days.filter(x=>x.id!==id).map(x=>`
    <button class="big swaprow" data-swap="${x.id}">
      <span class="sd">${esc(x.dow)} ${fmtDate(x.date)}</span>
      <span class="badge b-${x.kind==="trip"?"free":x.kind}">${KIND_LABEL[x.kind]||x.kind}</span>
      <b>${esc(x.where)}</b>
    </button>`).join("");
  openSheet("Prehodiť: "+d.where,
    `<div class="swapnote">Dátum, deň v týždni a typ dňa zostanú na mieste — presunie sa plán, poznámky aj odškrtnutie.</div>`+rows);
}

function openMenu(){
  openSheet("Nastavenia",`
    <button class="big" data-m="export">Zálohovať do súboru<small>Uloží poznámky, odškrtnuté dni a úpravy ako .json</small></button>
    <button class="big" data-m="import">Načítať zálohu<small>Prepíše aktuálny stav zo súboru</small></button>
    <button class="big" data-m="share">Zdieľať poznámky ako text<small>Pošlite si zhrnutie do správy alebo mailu</small></button>
    <div class="seglabel">Vzhľad</div>
    <div class="seg" role="group" aria-label="Vzhľad">
      ${["auto","light","dark"].map(t=>
        `<button data-th="${t}" aria-pressed="${(S.theme||"auto")===t}">${THEME_LABEL[t]}</button>`).join("")}
    </div>
    <button class="big danger" data-m="reset">Vrátiť na pôvodný plán<small>Zmaže všetky odškrtnutia a poznámky</small></button>
    <div style="font-size:12.5px;color:var(--muted);padding:8px 4px 0;line-height:1.5">
      Všetko sa ukladá len do tohto telefónu. Funguje aj bez internetu — mapy sa otvoria, keď signál bude.
    </div>`);
}
$("#menuBtn").addEventListener("click",openMenu);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && sheet.classList.contains("on")) closeSheet();
});
sheet.addEventListener("click",e=>{
  if(e.target.dataset.close!==undefined){ closeSheet(); return; }
  const sw=e.target.closest("[data-swap]")?.dataset.swap;
  if(sw && swapFrom){
    const from=S.days.find(x=>x.id===swapFrom), to=S.days.find(x=>x.id===sw);
    const fromKind=from.kind, toKind=to.kind, moved=from.where;
    if(swapDays(swapFrom,sw)){
      openDays.add(sw); openDays.delete("edit:"+swapFrom);
      closeSheet(); renderDays(); renderTotals();
      toast(fromKind===toKind ? "Prehodené"
        : moved+" je teraz "+(KIND_LABEL[toKind]||toKind));
    }
    return;
  }
  const th=e.target.closest("[data-th]")?.dataset.th;
  if(th){
    S.theme=th; save(); applyTheme();
    sheet.querySelectorAll("[data-th]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.th===th));
    toast("Vzhľad: "+THEME_LABEL[th]);
    return;
  }
  const m=e.target.closest("[data-m]")?.dataset.m; if(!m) return;
  if(m==="export"){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="split-2026-zaloha.json"; a.click(); URL.revokeObjectURL(a.href);
    closeSheet(); toast("Záloha stiahnutá");
  }
  if(m==="import"){
    const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange=()=>{ const f=i.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ try{ S=JSON.parse(r.result); save(); boot(); closeSheet(); toast("Záloha načítaná"); }
        catch(err){ alert("Súbor sa nepodarilo prečítať. Vyberte .json zálohu z tejto appky."); } };
      r.readAsText(f); };
    i.click();
  }
  if(m==="share"){
    const txt=S.days.map(d=>`${d.dow} ${fmtDate(d.date)} ${d.done?"[x]":"[ ]"} ${d.where}${d.note?"\n   → "+d.note:""}${d.actual?"\n   → minuté: "+d.actual+" €":""}`).join("\n");
    const full="Split 2026 — stav plánu\n\n"+txt;
    if(navigator.share){ navigator.share({title:"Split 2026",text:full}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(full); toast("Skopírované"); }
    else { alert(full); }
    closeSheet();
  }
  if(m==="reset"){
    if(confirm("Naozaj vrátiť všetko na pôvodný plán? Poznámky sa stratia.")){
      S=freshState(); openDays.clear(); save(); boot(); closeSheet(); toast("Obnovené");
    }
  }
});

function jumpToToday(){
  if(S.tab!=="plan") showTab("plan");
  const el=document.querySelector(".day.today");
  if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); return true; }
  return false;
}
$("#ringBtn").addEventListener("click",()=>{
  if(!jumpToToday()) toast("Dnešok nie je v pláne");
});

function boot(){
  applyTheme();
  qBox.value=S.q||"";
  syncSearch();
  document.querySelectorAll("#filters .chip").forEach(x=>x.setAttribute("aria-pressed", x.dataset.f===S.filter));
  showTab(S.tab||"plan");
}
boot();

// jump to today's card on open
if(S.tab==="plan"){
  const el=document.querySelector(".day.today");
  if(el) setTimeout(()=>el.scrollIntoView({block:"center"}),120);
}
</script>
